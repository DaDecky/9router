name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string

concurrency:
  group: docker-publish-${{ github.repository }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: decolua/9router

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      publish_dockerhub: ${{ steps.release.outputs.publish_dockerhub }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 1

      - name: Validate tag and package versions
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const tag = process.env.RELEASE_TAG || "";
          const match = /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$/.exec(tag);

          if (!match) {
            console.error(`Expected a semver tag like v0.5.81, received: ${tag || "<empty>"}`);
            process.exit(1);
          }

          const version = match[1];
          const rootVersion = require("./package.json").version;
          const cliVersion = require("./cli/package.json").version;

          if (rootVersion !== version) {
            console.error(`package.json version ${rootVersion} does not match tag ${tag}`);
            process.exit(1);
          }

          if (cliVersion !== version) {
            console.error(`cli/package.json version ${cliVersion} does not match tag ${tag}`);
            process.exit(1);
          }

          const commit = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const publishDockerHub = process.env.REPOSITORY === "decolua/9router";
          const output = process.env.GITHUB_OUTPUT;

          fs.appendFileSync(output, `tag=${tag}\n`);
          fs.appendFileSync(output, `version=${version}\n`);
          fs.appendFileSync(output, `commit=${commit}\n`);
          fs.appendFileSync(output, `publish_dockerhub=${publishDockerHub}\n`);
          NODE

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            ALPINE_MIRROR=${{ vars.ALPINE_MIRROR || 'dl-cdn.alpinelinux.org' }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org/' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=9router-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=9router-${{ matrix.suffix }}
          provenance: false
          sbom: false

      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.suffix }}.txt"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/${{ matrix.suffix }}.txt
          if-no-files-found: error

  publish:
    name: Publish and verify manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify version manifest
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP"/digests/*.txt)

          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(tr -d '\n' < "$digest_file")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid image digest in $digest_file: $digest" >&2
              exit 1
            fi
            sources+=("${GHCR_IMAGE}@${digest}")
          done

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:${VERSION}" \
            "${sources[@]}"

          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" | tee "$RUNNER_TEMP/version-manifest.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/version-manifest.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/version-manifest.txt"

      - name: Smoke-test version image
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          container="9router-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container" \
            --publish 20128:20128 \
            "${GHCR_IMAGE}:${VERSION}"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$container"
          exit 1

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish version image to Docker Hub
        if: needs.prepare.outputs.publish_dockerhub == 'true'
        env:
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:${VERSION}" \
            "${GHCR_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}" | tee "$RUNNER_TEMP/dockerhub-version-manifest.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/dockerhub-version-manifest.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/dockerhub-version-manifest.txt"

      - name: Promote verified version to latest
        env:
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          PUBLISH_DOCKERHUB: ${{ needs.prepare.outputs.publish_dockerhub }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:${VERSION}"

          if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
            docker buildx imagetools create \
              --tag "${DOCKERHUB_IMAGE}:latest" \
              "${GHCR_IMAGE}:latest"
          fi

          docker buildx imagetools inspect "${GHCR_IMAGE}:latest" | tee "$RUNNER_TEMP/ghcr-latest-manifest.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/ghcr-latest-manifest.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/ghcr-latest-manifest.txt"

          if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
            docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:latest" | tee "$RUNNER_TEMP/dockerhub-latest-manifest.txt"
            grep -q 'linux/amd64' "$RUNNER_TEMP/dockerhub-latest-manifest.txt"
            grep -q 'linux/arm64' "$RUNNER_TEMP/dockerhub-latest-manifest.txt"
          fi

          {
            echo "### Published Docker images"
            echo "- GHCR: \`${GHCR_IMAGE}:${VERSION}\`"
            echo "- GHCR latest: \`${GHCR_IMAGE}:latest\`"
            if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
              echo "- Docker Hub: \`${DOCKERHUB_IMAGE}:${VERSION}\`"
              echo "- Docker Hub latest: \`${DOCKERHUB_IMAGE}:latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
